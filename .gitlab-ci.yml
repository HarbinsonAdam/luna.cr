stages:
  - lint
  - test
  - release

include:
  - project: "harbinson-dev/ci-templates"
    ref: "main"
    file:
      - "/templates/crystal.yml"
      - "/templates/release-tags.yml"

# ----------------------------
# LINT (main + MRs)
# ----------------------------
ameba:
  stage: lint
  extends: .ameba_lint
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ----------------------------
# TESTS (main + MRs)
# ----------------------------
.test_rules:
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_BRANCH == "main"'

crystal_spec_sqlite:
  stage: test
  image: crystallang/crystal:1.16.3-alpine
  needs:
    - ameba
  before_script:
    - apk add --no-cache sqlite-dev
    - rm -rf lib .shards
    - shards install --skip-postinstall --skip-executables
  script:
    - crystal spec -Dsqlite_adapter
  extends: .test_rules

crystal_spec_pg:
  stage: test
  image: crystallang/crystal:1.16.3-alpine
  needs:
    - ameba
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: luna_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    LUNA_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/luna_test
  before_script:
    - apk add --no-cache postgresql-dev postgresql-client
    - until pg_isready -h postgres -U postgres -d luna_test; do sleep 1; done
    - rm -rf lib .shards
    - shards install --skip-postinstall --skip-executables
  script:
    - crystal spec -Dpg_adapter
  extends: .test_rules

crystal_spec_mysql:
  stage: test
  image: crystallang/crystal:1.16.3-alpine
  needs:
    - ameba
  services:
    - name: mysql:8.0
      alias: mysql
      command: ["--default-authentication-plugin=mysql_native_password"]
  variables:
    MYSQL_DATABASE: luna_test
    MYSQL_ROOT_PASSWORD: password
    LUNA_TEST_DATABASE_URL: mysql://root:password@mysql:3306/luna_test
  before_script:
    - apk add --no-cache mariadb-connector-c-dev mariadb-client
    - until mysqladmin ping -hmysql -uroot -ppassword --silent; do sleep 1; done
    - rm -rf lib .shards
    - shards install --skip-postinstall --skip-executables
  script:
    - crystal spec -Dmysql_adapter
  extends: .test_rules

crystal_build_core:
  stage: test
  image: crystallang/crystal:1.16.3-alpine
  needs:
    - ameba
  before_script:
    - rm -rf lib .shards
    - shards install --skip-postinstall --skip-executables
  script:
    - crystal build src/luna.cr
  extends: .test_rules

# ----------------------------
# RELEASE TAGS (main only)
# These create a tag and start a new tag pipeline
# ----------------------------
tag_patch:
  stage: release
  extends: .tag_patch
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'
      when: manual

tag_minor:
  stage: release
  extends: .tag_minor
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'
      when: manual

tag_major:
  stage: release
  extends: .tag_major
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'
      when: manual
